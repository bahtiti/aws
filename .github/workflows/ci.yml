name: CI — Security & Lint

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [main, staging, develop]

permissions:
  contents: read
  security-events: write   # for uploading SARIF results
  pull-requests: write

jobs:
  # ── 1. YAML / JSON lint ────────────────────────────────────────────────────
  yaml-lint:
    name: YAML & JSON Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              truthy:
                allowed-values: ['true', 'false']

  # ── 2. CloudFormation lint ─────────────────────────────────────────────────
  cfn-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation templates
        run: |
          shopt -s globstar nullglob
          templates=(cfn/**/*.{yaml,yml,json} cloudformation/**/*.{yaml,yml,json} stacks/**/*.{yaml,yml,json})
          if [ ${#templates[@]} -eq 0 ]; then
            echo "No CloudFormation templates found — skipping."
            exit 0
          fi
          cfn-lint "${templates[@]}"

  # ── 3. Terraform lint & validate ──────────────────────────────────────────
  terraform-lint:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Terraform files
        id: tf-check
        run: |
          count=$(find . -name '*.tf' | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        if: steps.tf-check.outputs.count > 0
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        if: steps.tf-check.outputs.count > 0
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        if: steps.tf-check.outputs.count > 0
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        if: steps.tf-check.outputs.count > 0
        run: |
          tflint --init
          tflint --recursive

  # ── 4. Security scan (Checkov) ─────────────────────────────────────────────
  checkov:
    name: IaC Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
          output_format: sarif
          output_file_path: checkov.sarif
          skip_check: >-
            CKV_GIT_1
          # Add project-specific skips below if justified and documented
          # skip_check: CKV_AWS_XXX

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ── 5. Secret scan (TruffleHog) ───────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret detection

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── 6. Markdown lint ───────────────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false
            }
