name: Drift Detection

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'develop'
        type: choice
        options: [develop, staging, main]

permissions:
  contents: read
  issues: write

jobs:
  detect-drift:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Use OIDC — no long-lived keys stored in secrets
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Check for Terraform
        id: tf-check
        run: echo "exists=$(find . -name '*.tf' | wc -l)" >> $GITHUB_OUTPUT

      - name: Terraform Plan (drift)
        if: steps.tf-check.outputs.exists > 0
        run: |
          terraform init -input=false
          terraform plan -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Open drift issue if changes detected
        if: steps.tf-check.outputs.exists > 0 && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : 'Plan output unavailable.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift] Infrastructure drift detected — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## ⚠️ Infrastructure Drift Detected',
                '',
                'The scheduled drift detection job found differences between the desired state',
                '(IaC in `main`) and the actual state in AWS.',
                '',
                '### Plan Output',
                '```',
                plan.slice(0, 60000),
                '```',
                '',
                'Please investigate and reconcile the drift.',
              ].join('\n'),
              labels: ['drift', 'infrastructure', 'automated'],
            });
