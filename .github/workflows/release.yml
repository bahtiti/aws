name: Release — Semantic Versioning & Tagging

on:
  push:
    branches:
      - main      # production release  (e.g. v1.2.3)
      - staging   # release candidate   (e.g. v1.2.3-rc.1)
      - develop   # dev pre-release     (e.g. v1.2.3-dev.1)

permissions:
  contents: write        # create tags & releases
  issues: write          # comment on related issues
  pull-requests: write   # comment on related PRs
  id-token: write        # OIDC (future use)

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip if commit was made by the bot itself (avoid release loops)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history required by semantic-release
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            conventional-changelog-conventionalcommits

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Summary
        if: always()
        run: |
          echo "### Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
